name: Build Chimera USB open root

on:
  workflow_dispatch:
    inputs:
      reuse_kernel:
        description: Reuse prebuilt kernel instead of compiling source
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Start existing Chimera rootfs build
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_KERNEL: ${{ inputs.reuse_kernel }}
        run: |
          set -euo pipefail
          gh workflow run chimera.yml --repo "$GITHUB_REPOSITORY" --ref chimera \
            -f ssh_auth=open-root-usb -f "reuse_kernel=$REUSE_KERNEL"
          echo "Dispatched Chimera USB rootfs build on branch chimera."
