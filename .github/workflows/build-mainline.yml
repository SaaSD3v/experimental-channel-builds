name: Build mainline kernel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: channel-mainline-kernel
  cancel-in-progress: false

env:
  KERNEL_URL: https://github.com/SaaSD3v/linux.git
  KERNEL_REF: msm8953/latest
  MKBOOTIMG_URL: https://android.googlesource.com/platform/system/tools/mkbootimg
  MKBOOTIMG_REF: d3b6ee4295e1491432ce3d0fcfd53631177bbef4
  CHANNEL_ROOT_DEVICE: PARTLABEL=userdata

jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Validate builder scripts
        run: |
          set -eux
          bash -n mainline/build.sh
          bash -n mainline/build-bootimg.sh

      - name: Install kernel dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl make bc bison flex \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross libc6-arm64-cross linux-libc-dev-arm64-cross \
            device-tree-compiler libssl-dev libelf-dev dwarves \
            python3 gzip zstd file

      - name: Resolve kernel source
        id: source
        run: |
          set -euxo pipefail
          SOURCE_SHA="$(git ls-remote "$KERNEL_URL" "refs/heads/$KERNEL_REF" | awk 'NR==1 {print $1}')"
          test -n "$SOURCE_SHA"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Clone Channel kernel
        run: |
          set -euxo pipefail
          rm -rf kernel out
          mkdir -p out
          git clone --depth=1 --branch "$KERNEL_REF" "$KERNEL_URL" kernel
          test "$(git -C kernel rev-parse HEAD)" = "${{ steps.source.outputs.source_sha }}"
          test -s kernel/arch/arm64/boot/dts/qcom/sdm632-motorola-channel.dts
          {
            echo "kernel_url=$KERNEL_URL"
            echo "kernel_ref=$KERNEL_REF"
            echo "kernel_source_sha=$(git -C kernel rev-parse HEAD)"
          } > out/source-report.txt

      - name: Build Channel mainline kernel
        env:
          KERNEL_DIR: ${{ github.workspace }}/kernel
          OUT_DIR: ${{ github.workspace }}/out
        run: |
          set -euxo pipefail
          chmod +x mainline/build.sh
          mainline/build.sh
          test -s out/Image.gz
          test -s out/Image.gz-dtb
          test -s out/sdm632-motorola-channel.dtb
          test -s out/kernel.config
          test -s out/System.map
          test -s out/kernel-release.txt
          compgen -G 'out/kernel-modules-*.tar.zst' >/dev/null
          test "$(fdtget -t s out/sdm632-motorola-channel.dtb /soc@0/remoteproc@a204000/iris compatible)" = "qcom,wcn3620"

      - name: Prepare AOSP mkbootimg
        run: |
          set -euxo pipefail
          rm -rf aosp-mkbootimg
          git init aosp-mkbootimg
          git -C aosp-mkbootimg remote add origin "$MKBOOTIMG_URL"
          git -C aosp-mkbootimg fetch --depth=1 origin "$MKBOOTIMG_REF"
          git -C aosp-mkbootimg checkout --detach FETCH_HEAD
          test "$(git -C aosp-mkbootimg rev-parse HEAD)" = "$MKBOOTIMG_REF"
          python3 aosp-mkbootimg/mkbootimg.py --help >/dev/null
          python3 aosp-mkbootimg/unpack_bootimg.py --help >/dev/null

      - name: Build direct-root boot image
        env:
          KERNEL_RELEASE: ${{ env.KERNEL_RELEASE }}
          OUT_DIR: ${{ github.workspace }}/out
          KERNEL_IMAGE: ${{ github.workspace }}/out/Image.gz
          CHANNEL_DTB: ${{ github.workspace }}/out/sdm632-motorola-channel.dtb
          CHANNEL_ROOT_DEVICE: ${{ env.CHANNEL_ROOT_DEVICE }}
          MKBOOTIMG_PY: ${{ github.workspace }}/aosp-mkbootimg/mkbootimg.py
        run: |
          set -euxo pipefail
          chmod +x mainline/build-bootimg.sh
          mainline/build-bootimg.sh
          test -s out/boot-channel.img
          grep -Fq "root=$CHANNEL_ROOT_DEVICE" out/kernel-cmdline.txt
          grep -Fq 'rootfstype=ext4' out/kernel-cmdline.txt
          grep -Fq 'rootwait' out/kernel-cmdline.txt
          ! grep -Fq 'rdinit=/init' out/kernel-cmdline.txt

          rm -rf /tmp/unpacked-boot
          python3 aosp-mkbootimg/unpack_bootimg.py --boot_img out/boot-channel.img --out /tmp/unpacked-boot
          test -s /tmp/unpacked-boot/kernel
          test ! -s /tmp/unpacked-boot/ramdisk

          echo "root_device=$CHANNEL_ROOT_DEVICE" >> out/kernel-info.txt

      - name: Finalize kernel checkpoint
        run: |
          set -euxo pipefail
          sha256sum \
            out/boot-channel.img \
            out/Image.gz \
            out/Image.gz-dtb \
            out/sdm632-motorola-channel.dtb \
            out/kernel.config \
            out/System.map \
            out/kernel-release.txt \
            out/kernel-modules-*.tar.zst \
            > out/SHA256SUMS

      - name: Upload reusable kernel checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: channel-mainline-kernel-${{ steps.source.outputs.source_sha }}
          path: |
            out/boot-channel.img
            out/kernel-cmdline.txt
            out/Image.gz
            out/Image.gz-*
            out/Image.gz-dtb
            out/Image.gz-dtb-*
            out/sdm632-motorola-channel.dtb
            out/kernel.config
            out/System.map
            out/kernel-release.txt
            out/kernel-git-revision.txt
            out/kernel-info.txt
            out/kernel-modules-*.tar.zst
            out/source-report.txt
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 90
