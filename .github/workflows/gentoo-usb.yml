name: Build Gentoo USB open root

on:
  workflow_dispatch:
    inputs:
      reuse_kernel:
        description: Reuse prebuilt kernel instead of compiling source
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Start existing Gentoo rootfs build
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_KERNEL: ${{ inputs.reuse_kernel }}
        run: |
          set -euo pipefail
          gh workflow run gentoo.yml --repo "$GITHUB_REPOSITORY" --ref gentoo \
            -f ssh_auth=open-root-usb -f "reuse_kernel=$REUSE_KERNEL"
          echo "Dispatched Gentoo USB rootfs build on branch gentoo."
